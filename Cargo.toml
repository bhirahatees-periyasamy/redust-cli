[package]
name = "redust"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small Redis-like in-memory key-value store"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rustyline = "18.0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
